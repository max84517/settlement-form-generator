[tool.poetry]
name = "settlement-form-generator"
version = "0.3.2"
description = "Automatically generate Word settlement contracts from Excel data"
authors = []
packages = [{ include = "settlement_form", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
customtkinter = "^5.2.2"
openpyxl = "^3.1.5"
python-docx = "^1.1.2"
pandas = "^2.2.0"
num2words = "^0.5.14"

[tool.poetry.scripts]
settlement-form = "settlement_form.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


